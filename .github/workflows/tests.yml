# Тесты логики стыковки на трёх ОС (без окна: GUI проверяется вручную / tests/gui_smoke.py)
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgomp1
      - run: python -m pip install -r requirements.txt flask
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
